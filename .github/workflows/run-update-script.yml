name: Run Update Script & Auto-Commit
on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Path to update script to execute (e.g. scripts/update.sh)"
        required: true
        default: "scripts/update.sh"
  push:
    branches: [main]
    paths: ["scripts/*.sh"]
permissions:
  contents: write
jobs:
  apply-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - env:
          SCRIPT_PATH: ${{ github.event.inputs.script_path || 'scripts/update.sh' }}
        run: |
          chmod +x "$SCRIPT_PATH"
          ./"$SCRIPT_PATH"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "chore(workflow): apply update script changes"
          git pull --rebase origin main
          git push origin main
